appId: com.hound.desktop
productName: Hound
npmRebuild: false
directories:
  output: release
files:
  - out/**/*
  - package.json
  - node_modules/better-sqlite3/**/*
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
win:
  target:
    - target: zip
      arch: [x64]
    - target: dir
      arch: [x64]
  icon: public/hound.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Hound
mac:
  target: dmg
  category: public.app-category.productivity
  icon: public/hound.png
