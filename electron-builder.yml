appId: com.nudge.desktop
productName: Nudge
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.productivity
